  ];

  var QUESTIONS_PER_ROUND = 10;
  var currentMode = 'en-ru';
  var currentQuestions = [];
  var currentIndex = 0;
  var correctCount = 0;
  var wrongCount = 0;
  var answered = false;

  var statCorrect = document.getElementById('statCorrect');
  var statWrong = document.getElementById('statWrong');
  var statProgress = document.getElementById('statProgress');
  var screenMenu = document.getElementById('screenMenu');
  var screenQuiz = document.getElementById('screenQuiz');
  var screenResult = document.getElementById('screenResult');
  var questionLabel = document.getElementById('questionLabel');
  var wordDisplay = document.getElementById('wordDisplay');
  var optionsContainer = document.getElementById('optionsContainer');
  var progressFill = document.getElementById('progressFill');
  var resultEmoji = document.getElementById('resultEmoji');
  var resultTitle = document.getElementById('resultTitle');
  var resultScore = document.getElementById('resultScore');

  function showScreen(screenId) {
    screenMenu.classList.remove('active');
    screenQuiz.classList.remove('active');
    screenResult.classList.remove('active');
    document.getElementById(screenId).classList.add('active');
  }

  function goToMenu() {
    showScreen('screenMenu');
  }

  function shuffle(array) {
    var arr = array.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = arr[i];
      arr[i] = arr[j];
      arr[j] = temp;
    }
    return arr;
  }

  function startQuiz(mode) {
    currentMode = mode || 'en-ru';
    currentIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    answered = false;

    statCorrect.textContent = '0';
    statWrong.textContent = '0';
    statProgress.textContent = '0%';

    var shuffled = shuffle(words);
    currentQuestions = shuffled.slice(0, QUESTIONS_PER_ROUND);

    showScreen('screenQuiz');
    showQuestion();
  }

  function showQuestion() {
    answered = false;
    var q = currentQuestions[currentIndex];
    var isEnRu = currentMode === 'en-ru' || (currentMode === 'random' && Math.random() < 0.5);

    var questionWord = isEnRu ? q.en : q.ru;
    var correctAnswer = isEnRu ? q.ru : q.en;

    questionLabel.textContent = 'Вопрос ' + (currentIndex + 1) + ' из ' + QUESTIONS_PER_ROUND;
    wordDisplay.textContent = questionWord;

    var wrongOptions = [];
    while (wrongOptions.length < 3) {
      var randomWord = words[Math.floor(Math.random() * words.length)];
      var wrongAnswer = isEnRu ? randomWord.ru : randomWord.en;
      if (wrongAnswer !== correctAnswer && wrongOptions.indexOf(wrongAnswer) === -1) {
        wrongOptions.push(wrongAnswer);
      }
    }

    var allOptions = shuffle([correctAnswer].concat(wrongOptions));

    optionsContainer.innerHTML = '';
    allOptions.forEach(function(option) {
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = option;
      btn.onclick = function() { checkAnswer(btn, option, correctAnswer); };
      optionsContainer.appendChild(btn);
    });

    var progress = (currentIndex / QUESTIONS_PER_ROUND) * 100;
    progressFill.style.width = progress + '%';
    statProgress.textContent = Math.round(progress) + '%';
  }

  function checkAnswer(btn, selected, correct) {
    if (answered) return;
    answered = true;

    var allButtons = optionsContainer.querySelectorAll('.option-btn');
    allButtons.forEach(function(b) { b.classList.add('disabled'); });

    if (selected === correct) {
      btn.classList.add('correct');
      correctCount++;
      statCorrect.textContent = correctCount;
    } else {
      btn.classList.add('wrong');
      wrongCount++;
      statWrong.textContent = wrongCount;
      allButtons.forEach(function(b) {
        if (b.textContent === correct) b.classList.add('correct');
      });
    }

    setTimeout(function() {
      currentIndex++;
      if (currentIndex < QUESTIONS_PER_ROUND) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }, 1200);
  }

  function finishQuiz() {
    progressFill.style.width = '100%';
    statProgress.textContent = '100%';

    showScreen('screenResult');

    var percent = Math.round((correctCount / QUESTIONS_PER_ROUND) * 100);

    if (percent === 100) {
      resultEmoji.textContent = '🏆';
      resultTitle.textContent = 'Идеально!';
      launchConfetti();
    } else if (percent >= 80) {
      resultEmoji.textContent = '🎉';
      resultTitle.textContent = 'Отлично!';
      launchConfetti();
    } else if (percent >= 60) {
      resultEmoji.textContent = '👍';
      resultTitle.textContent = 'Хорошо!';
    } else if (percent >= 40) {
      resultEmoji.textContent = '💪';
      resultTitle.textContent = 'Неплохо!';
    } else {
      resultEmoji.textContent = '📚';
      resultTitle.textContent = 'Попробуй ещё!';
    }

    resultScore.innerHTML = 'Правильно: <span>' + correctCount + '</span> из <span>' + QUESTIONS_PER_ROUND + '</span>';
  }

  function launchConfetti() {
    if (typeof confetti === 'function') {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }
  }

  window.addEventListener('load', function() {
    showScreen('screenMenu');
  });
</script>
</body>
</html>
